name: Code Quality

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

jobs:
  formatting:
    name: Code Formatting (Black & isort)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.13-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Check code formatting with Black
        run: poetry run black --check .

      - name: Check import sorting with isort
        run: poetry run isort --check .

  type-checking:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.13-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies with optional deps (torch, mpi4py)
        run: poetry install --no-interaction --extras "ci optional" --with dev

      - name: Run mypy type checking on core modules
        run: |
          poetry run mypy --explicit-package-bases \
            src/dmx/arithmetic.py \
            src/dmx/utils \
            src/dmx/stats \
            src/dmx/bstats \
            src/dmx/torch_utils \
            src/dmx/torch_stats \
            src/dmx/mpi4py \
            examples \
            tests

  linting:
    name: Linting (pylint)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.13-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies with optional deps (torch, mpi4py)
        run: poetry install --no-interaction --extras "ci optional" --with dev

      - name: Run pylint on core modules
        run: |
          poetry run pylint src/dmx/stats --jobs=1 --fail-under=10
          poetry run pylint src/dmx/bstats --jobs=1 --fail-under=10
          poetry run pylint src/dmx/torch_stats --jobs=1 --fail-under=10
          poetry run pylint src/dmx/mpi4py --jobs=1 --fail-under=10
          poetry run pylint src/dmx/utils --jobs=1 --fail-under=10
          poetry run pylint src/dmx/torch_utils --jobs=1 --fail-under=10
          poetry run pylint examples --jobs=1 --fail-under=10
          poetry run pylint tests --jobs=1 --fail-under=10

  docstring-quality:
    name: Docstring Quality (pydocstyle)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.13-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies with optional deps (torch, mpi4py)
        run: poetry install --no-interaction --extras "ci optional" --with dev

      - name: Run pydocstyle on core modules
        run: |
          poetry run pydocstyle src/dmx/stats/pdist.py \
                               src/dmx/stats/composite.py \
                               src/dmx/stats/conditional.py \
                               src/dmx/stats/ignored.py \
                               src/dmx/stats/null_dist.py \
                               src/dmx/stats/optional.py \
                               src/dmx/stats/select.py \
                               src/dmx/stats/weighted.py \
                               src/dmx/stats/binomial.py \
                               src/dmx/stats/categorical.py \
                               src/dmx/stats/catmultinomial.py \
                               src/dmx/stats/dirichlet.py \
                               src/dmx/stats/dirac_length.py \
                               src/dmx/stats/dmvn.py \
                               src/dmx/stats/dmvn_mixture.py \
                               src/dmx/stats/exponential.py \
                               src/dmx/stats/gamma.py \
                               src/dmx/stats/gaussian.py \
                               src/dmx/stats/geometric.py \
                               src/dmx/stats/gmm.py \
                               src/dmx/stats/heterogeneous_mixture.py \
                               src/dmx/stats/hidden_association.py \
                               src/dmx/stats/hidden_markov.py \
                               src/dmx/stats/hmixture.py \
                               src/dmx/stats/int_spike.py \
                               src/dmx/stats/int_edit_setdist.py \
                               src/dmx/stats/int_edit_stepsetdist.py \
                               src/dmx/stats/int_hidden_association.py \
                               src/dmx/stats/int_markovchain.py \
                               src/dmx/stats/int_plsi.py \
                               src/dmx/stats/intmultinomial.py \
                               src/dmx/stats/intrange.py \
                               src/dmx/stats/intsetdist.py \
                               src/dmx/stats/jmixture.py \
                               src/dmx/stats/lda.py \
                               src/dmx/stats/log_gaussian.py \
                               src/dmx/stats/markovchain.py \
                               src/dmx/stats/mixture.py \
                               src/dmx/stats/mvn.py \
                               src/dmx/stats/poisson.py \
                               src/dmx/stats/sequence.py \
                               src/dmx/stats/setdist.py \
                               src/dmx/stats/ss_mixture.py \
                               src/dmx/stats/vmf.py \
                               src/dmx/bstats \
                               src/dmx/torch_stats/pdist.py \
                               src/dmx/arithmetic.py \
                               src/dmx/utils \
                               src/dmx/torch_utils \
                               src/dmx/mpi4py/utils
